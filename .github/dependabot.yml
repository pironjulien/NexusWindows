# Dependabot: weekly updates of the pinned GitHub Actions and of each profile's dependencies, with a 7-day cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directories:
      - /commun/engine
      - /commun/launcher
      - /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The AOT compiler and trimmer follow the runtime of the SDK global.json pins (.NET 10): a new major comes with the
    # SDK change, never alone (11.0.0 proposed in November 2026).
    ignore:
      - dependency-name: Microsoft.DotNet.ILCompiler
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.NET.ILLink.Tasks
        update-types: ["version-update:semver-major"]
