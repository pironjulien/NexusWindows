# CodeQL, as a workflow file rather than the default setup (07/11/2026): same languages (actions, csharp) and default
# queries, but OpenSSF Scorecard only credits SAST through a workflow when commits land without pull requests (SAST
# was 0). C# is analyzed without a build (build-mode none), as the default setup did.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"

permissions: read-all

jobs:
  analyze:
    if: github.repository == 'pironjulien/NexusWindows'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.language }}
