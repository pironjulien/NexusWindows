# Offline checks on every push to main and pull request: exactly test.ps1 (dotnet test of the engine, its launcher and
# installers; node --test of the Codex adapter), on Windows. Actions pinned by commit SHA; Dependabot keeps them current.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: test.ps1
        shell: pwsh
        run: ./test.ps1
