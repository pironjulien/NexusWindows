# Release files: the Claude Desktop extension (nexus-windows-claude.mcpb, packed from claude/mcpb at the release tag)
# with SHA256SUMS.txt and a Sigstore bundle (GitHub artifact attestation, keyless; verify a file with
# `gh attestation verify <file> --repo pironjulien/NexusWindows`). NexusSystem downloads the extension from the latest
# release. The Codex plugin needs no file here: Codex installs it from this repository's codex/ folder (git-subdir).
name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # a release job never restores a cache (cache poisoning)
      - name: Claude Desktop extension
        run: |
          set -euo pipefail
          mkdir dist
          npx --yes @anthropic-ai/mcpb@2.1.2 pack claude/mcpb dist/nexus-windows-claude.mcpb
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        id: attest
        with:
          subject-path: dist/*
      - name: Attach the files and their Sigstore bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" dist/nexus-windows.sigstore.json
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
