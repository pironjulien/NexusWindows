# Release: on a vX.Y.Z tag (same version as codex/native, claude/mcpb/manifest.json, server.json and CHANGELOG.md), runs
# test.ps1, builds (commun/package.ps1) NexusWindows-win-x64.zip and NexusWindows-win-arm64.zip (stable launcher, Native
# AOT, + the self-contained engine: what get.ps1 installs), the Claude Desktop extension nexus-windows-claude.mcpb (x64,
# the name NexusSystem downloads from the latest release) and nexus-windows-claude-arm64.mcpb, and get.ps1, attests their build provenance (Sigstore, keyless:
# `gh attestation verify <file> --repo pironjulien/NexusWindows`), and publishes them with SHA256SUMS.txt and that
# provenance (NexusWindows-X.Y.Z.intoto.jsonl, for `gh attestation verify <file> --bundle`) as the "NexusWindows X.Y.Z"
# GitHub release. Then server.json, with the extension's URL and SHA-256, goes to the official MCP registry (GitHub OIDC
# login, namespace io.github.pironjulien; no token stored). Actions pinned by commit SHA; Dependabot keeps them current.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:  # registry only, for a release already published (server.json of the chosen ref)

permissions: {}

jobs:
  release:
    if: github.repository == 'pironjulien/NexusWindows' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      mcpb-sha256: ${{ steps.packages.outputs.mcpb-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # a release job never restores a cache (cache poisoning)
      - name: Tests (test.ps1)
        shell: pwsh
        run: ./test.ps1
      - name: Packages
        id: packages
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $server = Get-Content server.json -Raw | ConvertFrom-Json
          if ($server.version -ne $version) { throw "server.json has version $($server.version), not $version." }
          if ($server.packages[0].identifier -ne "https://github.com/pironjulien/NexusWindows/releases/download/$($env:TAG)/nexus-windows-claude.mcpb") { throw 'server.json names another bundle.' }
          ./commun/package.ps1 -Version $version -Out dist
          "mcpb-sha256=$((Get-FileHash dist/nexus-windows-claude.mcpb -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        id: provenance
        with:
          subject-path: dist/*
      - name: Provenance bundle
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: Copy-Item $env:BUNDLE "dist/NexusWindows-$($env:TAG.TrimStart('v')).intoto.jsonl"
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::FindIndex($lines, [Predicate[string]] { param($l) $l -like "## ``[$version``]*" })
          if ($start -lt 0) { throw "CHANGELOG.md has no [$version] section." }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]] { param($l) $l -like '## *' })
          if ($end -lt 0) { $end = $lines.Count }
          $lines[($start + 1)..($end - 1)] | Set-Content notes.md -Encoding utf8NoBOM
          gh release create $env:TAG (Get-ChildItem dist -File).FullName --title "NexusWindows $version" --notes-file notes.md --verify-tag

  registry:
    # server.json to the official MCP registry, with the extension just published. mcp-publisher pinned by version and
    # SHA-256; no token stored, no manual login.
    needs: release
    if: always() && github.repository == 'pironjulien/NexusWindows' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Bundle SHA-256 into server.json
        env:
          MCPB_SHA256: ${{ needs.release.outputs.mcpb-sha256 }}
        run: |
          set -euo pipefail
          url=$(jq -r '.packages[0].identifier' server.json)
          curl -fsSL -o bundle.mcpb "$url"
          actual=$(sha256sum bundle.mcpb | cut -d' ' -f1)
          # A push run checks the bundle against the hash its release job computed; a manual run takes the published one.
          if [[ -n "$MCPB_SHA256" && "$MCPB_SHA256" != "$actual" ]]; then echo "Bundle SHA-256 mismatch"; exit 1; fi
          jq --arg sha "$actual" '.packages[0].fileSha256 = $sha' server.json > server.tmp && mv server.tmp server.json
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --strict -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
