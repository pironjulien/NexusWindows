# Release, in two channels, with the shared Nexus release workflows of NexusSystem.
# - Development: every push to main checks one version everywhere (codex/native, the launcher, server.json, the
#   manifests and CHANGELOG.md), runs test.ps1 and builds (commun/package.ps1) NexusWindows-win-x64.zip and
#   NexusWindows-win-arm64.zip (stable launcher, Native AOT, + the self-contained engine: what get.ps1 installs), the
#   Claude Desktop extension nexus-windows-claude.mcpb (x64, the name NexusSystem and the MCP registry use) and
#   nexus-windows-claude-arm64.mcpb, get.ps1 and SHA256SUMS.txt. product-dev-release attests them (Sigstore, keyless:
#   `gh attestation verify <file> --repo pironjulien/NexusWindows --signer-repo pironjulien/NexusSystem`, bundle
#   NexusWindows-X.Y.Z.intoto.jsonl) and publishes the pre-release vX.Y.Z-dev.N (NexusSystem's development channel).
# - Stable: right after that build when its version is not released yet, or "Run workflow" (promote: a vX.Y.Z-dev.N,
#   or empty for the newest), product-promote runs: the SAME files
#   become the release "NexusWindows X.Y.Z" with the CHANGELOG section, then server.json goes to the official MCP
#   registry. registry: only re-send a stable release's server.json. get.ps1 installs from releases/latest.
# - Each published build (development and stable) is then installed from its release files in an isolated profile
#   (.github/scripts/verify-release.ps1): checksums, provenance, two installations, maintenance, client checks, MCP.
# Actions and shared workflows pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Development build to publish as stable (vX.Y.Z-dev.N; empty = the newest)
        required: false
        default: ''
      registry:
        description: Only send this stable release's server.json (vX.Y.Z) to the MCP registry again
        required: false
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'pironjulien/NexusWindows' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # a release job never restores a cache (cache poisoning)
      - name: One version everywhere
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content codex/native/NexusCodex.UIA.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "codex/native/NexusCodex.UIA.csproj: no X.Y.Z version ($version)." }
          $server = Get-Content server.json -Raw | ConvertFrom-Json
          $found = [ordered]@{
            'codex/native/McpServer.cs' = [regex]::Match((Get-Content codex/native/McpServer.cs -Raw), 'Version = "([^"]+)"').Groups[1].Value
            'commun/launcher/NexusWindows.Launcher.csproj' = ([xml](Get-Content commun/launcher/NexusWindows.Launcher.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            'commun/native-runtime.ps1' = [regex]::Match((Get-Content commun/native-runtime.ps1 -Raw), "Version='([^']+)'").Groups[1].Value
            'codex/package.json' = (Get-Content codex/package.json -Raw | ConvertFrom-Json).version
            'codex/.codex-plugin/plugin.json' = (Get-Content codex/.codex-plugin/plugin.json -Raw | ConvertFrom-Json).version
            'claude/mcpb/manifest.json' = (Get-Content claude/mcpb/manifest.json -Raw | ConvertFrom-Json).version
            'plugin/antigravity/plugin.json' = (Get-Content plugin/antigravity/plugin.json -Raw | ConvertFrom-Json).version
            'plugin/.claude-plugin/plugin.json' = (Get-Content plugin/.claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
            'plugin/.codex-plugin/plugin.json' = (Get-Content plugin/.codex-plugin/plugin.json -Raw | ConvertFrom-Json).version
            'server.json' = $server.version
          }
          $wrong = @($found.GetEnumerator() | Where-Object { $_.Value -ne $version } | ForEach-Object { "$($_.Key)=$($_.Value)" })
          if ($wrong) { throw "Version $version expected: $($wrong -join ', ')" }
          if ($server.packages[0].identifier -ne "https://github.com/pironjulien/NexusWindows/releases/download/v$version/nexus-windows-claude.mcpb") { throw 'server.json names another bundle.' }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## [$version]" -Quiet)) { throw "CHANGELOG.md has no [$version] section." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Tests (test.ps1)
        shell: pwsh
        run: ./test.ps1
      - name: Build and pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # commun/package.ps1 also writes dist/SHA256SUMS.txt, listing every other dist file.
          ./commun/package.ps1 -Version $env:VERSION -Out dist
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  dev:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pironjulien/NexusSystem/.github/workflows/product-dev-release.yml@9cf03f2ac93e207307351b393130ff1cfe2aef7b  # v1.6.40
    with:
      product: NexusWindows
      version: ${{ needs.build.outputs.version }}

  promote:
    # Right after the push that built a new version (same files), or by hand ("Run workflow").
    needs: dev
    if: always() && github.repository == 'pironjulien/NexusWindows' && (needs.dev.result == 'success' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      id-token: write
    uses: pironjulien/NexusSystem/.github/workflows/product-promote.yml@9cf03f2ac93e207307351b393130ff1cfe2aef7b  # v1.6.40
    with:
      product: NexusWindows
      promote: ${{ inputs.promote || needs.dev.outputs.tag }}
      registry-only: ${{ inputs.registry }}
      mcp-package: nexus-windows-claude.mcpb

  install-from-release:
    # Not covered by the shared workflows: install the build just published (development or stable) from its release
    # files in an isolated profile; no real client is changed.
    needs: [dev, promote]
    if: always() && (needs.dev.result == 'success' || (needs.promote.result == 'success' && needs.promote.outputs.tag != ''))
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify the published release in an isolated profile
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.dev.outputs.tag || needs.promote.outputs.tag }}
        run: ./.github/scripts/verify-release.ps1 -Tag $env:TAG -Work (Join-Path $env:RUNNER_TEMP ('nexuswindows-release-' + [guid]::NewGuid().ToString('N')))
