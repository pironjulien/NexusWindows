# Status of this owner's servers in the official MCP registry, by hand only ("Run workflow"): marks every version of
# a server deprecated (with a message naming its replacement) or active again. Used for the separate profile entries of
# October 2026 (io.github.pironjulien/nexus-windows-claude, -codex, -antigravity), replaced by
# io.github.pironjulien/nexus-windows. Never "deleted": a deprecated entry stays readable and says where to go.
# mcp-publisher pinned by version and SHA-256 (the version product-promote uses); GitHub OIDC login, no token stored.
name: Registry status

on:
  workflow_dispatch:
    inputs:
      server:
        description: Server name (io.github.pironjulien/...)
        required: true
      status:
        description: New status of every version
        type: choice
        options: [deprecated, active]
        default: deprecated
      message:
        description: Status message (for deprecated, the replacement)
        required: false
        default: ''

permissions: {}

jobs:
  status:
    if: github.repository == 'pironjulien/NexusWindows'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login to the registry (io.github.pironjulien namespace)
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      SERVER: ${{ inputs.server }}
      STATUS: ${{ inputs.status }}
      MESSAGE: ${{ inputs.message }}
    steps:
      - name: Check the server name
        run: |
          [[ "$SERVER" =~ ^io\.github\.pironjulien/[a-z0-9-]+$ ]] || { echo "Not a server of this owner: $SERVER"; exit 1; }
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --strict -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Set the status of every version
        run: ./mcp-publisher status --status "$STATUS" --message "$MESSAGE" --all-versions --yes "$SERVER"
      - name: Read it back from the registry
        run: |
          curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=${SERVER#io.github.pironjulien/}" \
            | jq -r --arg name "$SERVER" '.servers[] | select(.server.name == $name)
                | "\(.server.name) \(.server.version) \(._meta["io.modelcontextprotocol.registry/official"].status)"'
